<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>WATCHD </title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&family=VT323&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #0d0d0d;
    --surface: #161616;
    --surface2: #1e1e1e;
    --border: #2a2a2a;
    --border2: #000;
    --text: #f0ece4;
    --muted: #888;
    --accent: #e8c97e; /* Gold */
    --accent-dim: #c4a55a;
    --danger: #e05555;
    --success: #4caf7d;
    --info: #4a9dd8;
    --warning: #f59e0b;
    --radius: 4px;
    --radius-sm: 2px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-weight: 300;
    min-height: 100vh;
    display: flex; flex-direction: column;
    background-image: radial-gradient(#1a1a1a 1px, transparent 0);
    background-size: 20px 20px;
  }

  /* ── Header App (Fixed) ── */
  header.app-header {
    background: rgba(13, 13, 13, 0.95);
    backdrop-filter: blur(10px);
    border-bottom: 2px solid var(--border);
    padding: 10px 20px;
    height: 50px;
    display: flex; align-items: center; gap: 12px;
    position: sticky; top: 0; z-index: 50;
  } 
  
  .branding-left {
    display: flex; align-items: center; gap: 10px;
  }

  .header-icon {
    width: 28px; height: 28px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 4px;
    display: flex; align-items: center; justify-content: center;
    color: var(--accent); flex-shrink: 0;
  }
  header h1 {
    font-family: 'VT323', monospace;
    font-size: 22px; font-weight: 400;
    color: var(--text); 
    letter-spacing: 0.05em;
    text-transform: uppercase;
    line-height: 1;
  } 

  .config-btn {
    margin-left: auto;
    background: transparent; border: 1px solid var(--border);
    border-radius: 4px;
    color: var(--muted); cursor: pointer;
    padding: 4px 10px;
    display: flex; align-items: center; gap: 6px;
    font-size: 11px; font-weight: 500;
    transition: all 0.2s;
  }
  .config-btn:hover { color: var(--accent); border-color: var(--accent); }

  /* ── Main Container ── */
  main {
    width: 100%; 
    padding: 0;  
    flex: 1;
  }

  /* ── Config Panel ── */
  .config-panel {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 20px;
    display: none;
  }
  .config-panel.open { display: block; }
  .config-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; margin-bottom: 12px;}
  @media (max-width: 600px) { .config-grid { grid-template-columns: 1fr; } }

  /* Inputs */
  input[type="text"], input[type="number"], input[type="password"], textarea, select {
    background: #000;
    border: 2px solid var(--border); 
    border-radius: 4px;
    color: var(--text);
    font-family: 'VT323', monospace;
    font-size: 18px;
    padding: 12px 14px;
    outline: none;
    transition: border-color 0.2s;
    width: 100%;
    appearance: none;
    box-shadow: inset 0 0 10px rgba(255,255,255,0.05);
  }
  input:focus, textarea:focus, select:focus { border-color: var(--accent-dim); color: var(--accent); }

  /* Custom Select Arrow */
  .select-wrap { position: relative; }
  .select-wrap::after {
    content: '▼';
    font-size: 12px;
    position: absolute; right: 14px; top: 50%; transform: translateY(-50%);
    color: var(--accent);
    pointer-events: none;
    z-index: 2;
  }
  
  #f-status {
    cursor: pointer;
    background-color: #000;
    color: #fff;
    font-weight: bold;
  }
  #f-status option { background-color: #111; color: #fff; }

  /* Buttons */
  .btn {
    font-family: 'VT323', monospace;
    font-size: 18px; font-weight: 400;
    padding: 12px 24px; border-radius: 4px;
    border: 2px solid var(--border2);
    background: var(--surface); color: var(--text);
    cursor: pointer; transition: all 0.1s;
    display: inline-flex; align-items: center; justify-content: center; gap: 10px;
    text-transform: uppercase;
  }
  .btn:hover { background: var(--surface2); border-color: var(--muted); }
  
  .btn-retro-action {
    font-family: 'VT323', monospace;
    font-size: 18px; font-weight: bold;
    text-transform: uppercase;
    border-radius: 50%;
    width: 60px; height: 60px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    box-shadow: 4px 4px 0px rgba(0,0,0,0.8);
    transition: transform 0.1s, box-shadow 0.1s;
    cursor: pointer;
  }
  .btn-retro-action:hover { transform: scale(1.05); box-shadow: 6px 6px 0 rgba(0,0,0,0.8); }
  .btn-retro-action:active { transform: scale(0.95); box-shadow: 2px 2px 0 rgba(0,0,0,0.8); }

  .btn-b { background: #d32f2f; color: #fff; border: 2px solid #b71c1c; }
  .btn-a { background: #2e7d32; color: #fff; border: 2px solid #164218; }
  .btn-ghost { background: transparent; border: 2px solid transparent; color: var(--muted); padding: 12px 20px; border-radius: 4px; }
  .btn-ghost:hover { color: var(--text); background: rgba(255,255,255,0.05); border-color: var(--border); }

  /* Message */
  .msg { font-size: 13px; padding: 14px 20px; margin: 0; line-height: 1.5; display: none; border-bottom: 1px solid var(--border); font-family: 'VT323', monospace; font-size: 18px; }
  .msg.show { display: block; }
  .msg-s { background: rgba(76,175,125,0.1); color: var(--success); border-bottom: 2px solid var(--success); }
  .msg-e { background: rgba(224,85,85,0.1); color: var(--danger); border-bottom: 2px solid var(--danger); }
  .msg-i { background: var(--surface2); color: var(--muted); }

  /* ── INITIAL STATE (RETRO TV) ── */
  .initial-state {
    flex: 1;
    display: flex; flex-direction: column; 
    align-items: center; justify-content: center; 
    padding: 20px;
    position: relative;
  }

  .retro-container {
    width: 100%; max-width: 700px;
    z-index: 1;
    display: flex; flex-direction: column; gap: 30px;
    animation: turnOn 0.4s ease-out;
  }
  @keyframes turnOn {
    0% { opacity: 0; transform: scale(0.95) scaleY(0.9); filter: blur(5px); }
    100% { opacity: 1; transform: scale(1) scaleY(1); filter: blur(0); }
  }

  .tv-frame {
    background: #111;
    padding: 15px;
    border-radius: 20px;
    box-shadow: 
      0 0 0 4px #222,
      0 0 0 8px #000,
      0 20px 50px rgba(0,0,0,0.6);
    position: relative;
    border-bottom: 6px solid #000;
  }

  .tv-screen {
    background: #1a1a1a;
    border-radius: 12px / 8px;
    overflow: hidden;
    position: relative;
    padding: 30px 20px;
    text-align: center;
    border: 2px solid #000;
    box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
    min-height: 180px;
    display: flex; flex-direction: column; justify-content: center; align-items: center;
  }
  .tv-screen::before {
    content: " "; display: block; position: absolute; top: 0; left: 0; bottom: 0; right: 0;
    background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
    z-index: 2; background-size: 100% 4px, 6px 100%; pointer-events: none;
  }
  .tv-screen::after {
    content: " "; display: block; position: absolute; top: 0; left: 0; bottom: 0; right: 0;
    background: rgba(18, 16, 16, 0.1); opacity: 0; z-index: 2; pointer-events: none;
    animation: flicker 0.15s infinite;
  }
  @keyframes flicker { 0% { opacity: 0.02; } 50% { opacity: 0.05; } 100% { opacity: 0.02; } }

  .tv-content { position: relative; z-index: 3; }
  .tv-title {
    font-family: 'VT323', monospace;
    font-size: 32px;
    color: var(--accent);
    text-shadow: 0 0 10px rgba(232, 201, 126, 0.5);
    margin-bottom: 8px; line-height: 1;
  }
  .tv-subtitle { font-family: 'VT323', monospace; font-size: 18px; color: #aaa; margin-bottom: 16px; }

  .tv-chips { display: flex; gap: 10px; justify-content: center; }
  .tv-chip {
    background: #000; border: 1px solid var(--border); color: var(--muted);
    font-family: 'VT323', monospace; font-size: 16px; padding: 2px 10px;
    cursor: pointer; text-transform: uppercase;
    box-shadow: 2px 2px 0 rgba(255,255,255,0.05); transition: 0.2s;
  }
  .tv-chip:hover { color: var(--accent); border-color: var(--accent); box-shadow: 2px 2px 0 rgba(232, 201, 126, 0.2); }
  .tv-chip.active { background: var(--accent); color: #000; border-color: var(--accent); }

  .remote-wrapper {
    background: rgba(22, 22, 22, 0.8);
    padding: 8px; border-radius: 12px;
    border: 1px solid #333;
    box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    display: flex; gap: 8px; align-items: center;
    backdrop-filter: blur(5px);
  }
  .retro-input {
    background: #000; border: 2px solid #333; color: var(--text);
    font-family: 'VT323', monospace; font-size: 20px; padding: 8px 16px;
    border-radius: 8px; flex: 1; outline: none; transition: all 0.2s;
    box-shadow: inset 2px 2px 5px rgba(0,0,0,0.5);
  }
  .retro-input::placeholder { color: #444; font-size: 18px; }
  .retro-input:focus { border-color: var(--accent); color: var(--accent); }

  .btn-power {
    width: 48px; height: 48px; background: #d32f2f; border: none; border-radius: 8px;
    color: #fff; display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    box-shadow: inset 0 2px 5px rgba(255,255,255,0.3), 0 4px 0 #8e0000;
    transition: all 0.1s;
  }
  .btn-power:active { transform: translateY(4px); box-shadow: inset 0 2px 5px rgba(0,0,0,0.5), 0 0 0 #8e0000; }
  .btn-power svg { width: 24px; height: 24px; }

  .static-footer { font-family: 'VT323', monospace; font-size: 14px; color: #444; margin-top: 10px; display: flex; align-items: center; gap: 8px; }
  .blink { animation: blinker 1.5s linear infinite; }
  @keyframes blinker { 50% { opacity: 0; } }


  /* ── PREVIEW CARD (RETRO MENU STYLE) ── */
  .preview-card {
    background: var(--surface);
    border-radius: 0;
    display: none;
    animation: fadeIn 0.4s ease;
  }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  .preview-card.show { display: block; }

  /* Hero Background Section */
  .hero-wrapper {
    position: relative; width: 100%; min-height: 320px; 
    background-color: #1a1a1a;
    background-size: cover; background-position: center top;
    overflow: visible;
    border-bottom: 4px solid #000; 
  }
  .hero-overlay {
    position: relative; min-height: 320px;
    background: linear-gradient(to top, var(--bg) 5%, rgba(13,13,13,0.7) 50%, rgba(13,13,13,0.2) 100%);
    display: flex; flex-direction: column; justify-content: flex-start;
    padding: 40px;
  }

  /* Content inside Hero */
  .hero-content {
    position: relative; z-index: 2;
    width: 100%;   
    padding-left: 40px; padding-right: 40px; padding-top: 20px; padding-bottom: 20px;
  }
  
  .p-type {
    font-family: 'VT323', monospace;
    font-size: 18px; letter-spacing: 0.1em;
    text-transform: uppercase; color: var(--accent); margin-bottom: 8px;
    background: rgba(0,0,0,0.6);
    padding: 2px 8px;
    display: inline-block;
    border: 1px solid var(--accent);
    border-radius: 4px;
  }
  .p-title {
    font-family: 'DM Serif Display', serif;
    font-size: 48px;
    line-height: 1.1;
    padding-top: 6px;
    white-space: normal;
    overflow-wrap: anywhere; 
    word-break: break-word; 
    max-width: 100%;
  }
  .p-studio { 
    font-family: 'VT323', monospace;
    font-size: 18px; color: #ccc; margin-bottom: 16px; 
    text-transform: uppercase; letter-spacing: 0.05em;
  }

  /* Meta Chips */
  .meta-inline {
    display: flex; flex-wrap: wrap; gap: 16px; align-items: center;
    font-size: 16px; color: #bbb; margin-bottom: 8px;
    font-family: 'VT323', monospace;
  }
  .meta-item { display: inline-flex; align-items: center; gap: 6px; animation: slideRight 0.4s ease; }
  @keyframes slideRight { from { opacity: 0; transform: translateX(-8px); } to { opacity: 1; transform: translateX(0); } }
  .meta-item svg { width: 16px; height: 16px; opacity: 0.8; stroke: var(--accent); }
  .meta-text { color: #fff; text-shadow: 1px 1px 0 #000; }
  .meta-status { color: var(--accent); font-weight: 600; }

  /* Genre Pills */
  .genre-pills { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
  .genre-pill {
    font-family: 'VT323', monospace;
    font-size: 16px; font-weight: 400;
    padding: 4px 12px; border-radius: 4px;
    background: #000;
    border: 2px solid var(--border2);
    color: var(--muted); display: flex; align-items: center; gap: 6px;
    transition: all 0.2s;
    animation: fadeInScale 0.4s ease;
    text-transform: uppercase;
  }
  @keyframes fadeInScale { from { opacity: 0; transform: scale(0.92); } to { opacity: 1; transform: scale(1); } }
  
  /* Retro Colors for Genres */
  .genre-pill:nth-child(1) { border-color: rgba(232,201,126,0.5); color: var(--accent); box-shadow: 2px 2px 0 rgba(232,201,126,0.2); }
  .genre-pill:nth-child(2) { border-color: rgba(74,157,216,0.5); color: var(--info); box-shadow: 2px 2px 0 rgba(74,157,216,0.2); }
  .genre-pill:nth-child(3) { border-color: rgba(76,175,125,0.5); color: var(--success); box-shadow: 2px 2px 0 rgba(76,175,125,0.2); }
  .genre-pill:nth-child(4) { border-color: rgba(245,158,11,0.5); color: var(--warning); box-shadow: 2px 2px 0 rgba(245,158,11,0.2); }
  .genre-pill:nth-child(5) { border-color: rgba(224,85,85,0.5); color: var(--danger); box-shadow: 2px 2px 0 rgba(224,85,85,0.2); }
  .genre-pill:nth-child(n+6) { border-color: rgba(232,201,126,0.5); color: var(--accent); box-shadow: 2px 2px 0 rgba(232,201,126,0.2); }
  
  .genre-pill:hover { 
    transform: translateY(-2px) translateX(-2px); 
    box-shadow: 4px 4px 0 currentColor; 
    color: #fff;
  }
  .genre-pill span { font-size: 18px; }

  /* Data Banner */
  .data-banner {
    display: inline-flex; align-items: center; gap: 8px;
    background: #000;
    border: 2px solid var(--danger);
    padding: 4px 12px; border-radius: 4px;
    font-family: 'VT323', monospace;
    font-size: 16px; font-weight: 400; color: var(--danger);
    margin-bottom: 16px;
    animation: slideDown 0.4s ease;
    box-shadow: 3px 3px 0 var(--danger);
  }
  @keyframes slideDown { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: translateY(0); } }

  /* ── Lower Content Area (RETRO FORM) ── */
  .details-container {
    max-width: 1200px;
    margin: 0 auto;
    width: 100%;
    padding: 24px 40px 60px; 
    display: grid;
    grid-template-columns: 240px 1fr;
    gap: 40px;
  }
  @media (max-width: 768px) {
    .details-container { grid-template-columns: 1fr; padding: 24px 20px 60px; }
    .hero-overlay { padding: 20px; }
    .p-title { font-size: 32px; }
  }

  .sidebar-cover {
    width: 100%; border-radius: 4px;
    overflow: hidden; border: 4px solid #000; 
    aspect-ratio: 2/3; position: sticky; top: 90px;
    box-shadow: 6px 6px 0 rgba(0,0,0,0.5);
  }
  .sidebar-cover img { width: 100%; height: 100%; object-fit: cover; }

  .main-info { display: flex; flex-direction: column; gap: 30px; }

  /* Synopsis */
  .synopsis-block {
    font-family: 'VT323', monospace;
    font-size: 18px;
    line-height: 1.5;
    color: #ddd;

    /* Clamping Logic */
    display: -webkit-box;
    -webkit-line-clamp: 4;
    -webkit-box-orient: vertical;
    overflow: hidden;

    /* Perbaikan Spasi: Margin Top & Bottom disamakan */
    margin-top: 16px;
    margin-bottom: 16px;
    
    transition: all 0.3s ease;
  }
  .synopsis-expanded {
    -webkit-line-clamp: unset;
    overflow: visible;
  }
  
  .read-more-btn {
    font-family: 'VT323', monospace;
    font-size: 16px;
    color: var(--accent);
    background: transparent;
    border: none;
    padding: 0;
    cursor: pointer;
    text-transform: uppercase;
    text-decoration: underline;
    text-underline-offset: 4px;
    display: none;
  }
  .read-more-btn:hover { color: #fff; }

  /* Form Section */
  .form-section {
    background: #111;
    border: 4px solid #000; 
    border-radius: 4px; 
    padding: 32px;
    box-shadow: 8px 8px 0 rgba(0,0,0,0.5);
  }
  .form-header {
    display: flex; justify-content: space-between; align-items: center;
    border-bottom: 2px dashed var(--border);
    padding-bottom: 8px; margin-bottom: 24px;
  }
  .form-label {
    font-family: 'VT323', monospace;
    font-size: 20px; color: var(--muted); text-transform: uppercase;
    letter-spacing: 0.05em; margin-bottom: 8px; font-weight: 400; display: block;
  }
  
  .form-row-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 20px; margin-bottom: 28px; }
  
  /* Notes Grid */
  .notes-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    margin-bottom: 28px;
  }
  @media (max-width: 600px) {
    .notes-grid { grid-template-columns: 1fr; }
    .form-row-3 { grid-template-columns: 1fr; gap: 16px; }
  }
  
  textarea {
    transition: border-color 0.2s, box-shadow 0.2s;
    resize: vertical;
  }
  textarea:focus {
    border-color: var(--accent-dim);
    box-shadow: inset 0 0 10px rgba(232,201,126,0.1);
  }

  /* Actions (Retro Controller) */
  .form-actions {
    display: flex; gap: 16px; margin-top: 8px;
    align-items: center;
    justify-content: space-between;
  }
  .actions-label {
    font-family: 'VT323', monospace;
    font-size: 14px;
    color: var(--muted);
    text-transform: uppercase;
    text-align: right;
  }

  /* Spinner */
  .spin {
    display: inline-block; width: 18px; height: 18px;
    border: 3px solid rgba(255,255,255,0.2);
    border-top-color: currentColor; border-radius: 50%;
    animation: sp .6s linear infinite;
  }
  @keyframes sp { to { transform: rotate(360deg); } }

</style>
</head>
<body>

<!-- Header -->
<header class="app-header"> 
  <div class="branding-left">   
    <h1>WATCHD</h1>    
  </div>

  <!-- Config di ujung kanan -->
  <button class="config-btn" onclick="toggleConfig()">
    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.07 4.93a10 10 0 1 1 0 14.14M4.93 4.93a10 10 0 1 0 0 14.14"/></svg>
    <span id="config-label">Config</span>
  </button>
</header>

<main>

  <div id="msg" class="msg"></div>

  <div class="config-panel" id="config-panel">
    <div class="config-grid">
      <div>
        <label class="form-label">Supabase Edge Function URL</label>
        <input type="text" id="cfg-fn" placeholder="https://xxx.supabase.co/functions/v1/fetch-watch-meta" />
      </div>
      <div>
        <label class="form-label">Notion Token</label>
        <input type="password" id="cfg-token" placeholder="ntn_xxx..." />
      </div>
      <div>
        <label class="form-label">Notion Database ID</label>
        <input type="text" id="cfg-db" placeholder="93313b1949..." />
      </div>
    </div>
    <button class="btn" onclick="saveConfig()" style="font-size:12px; padding:8px 16px;">Save Config</button>
  </div>

  <!-- INITIAL STATE (RETRO TV) -->
  <div class="initial-state" id="initial-state">
    
    <div class="retro-container">
      <!-- CRT TV Frame -->
      <div class="tv-frame">
        <div class="tv-screen">
          <div class="tv-content">
            <h2 class="tv-title">WELCOME BACK</h2>
            <p class="tv-subtitle">Select Channel to Start</p>
            
            <div class="tv-chips">
              <div class="tv-chip" onclick="fillInput('anineko.to')">CH 1: ANINEKO</div>
              <div class="tv-chip" onclick="fillInput('donkey.to')">CH 2: DONKEY</div>
            </div>
          </div>
        </div>
      </div>             
    
      <!-- Input Area styled like a Remote Control -->
      <div class="remote-wrapper">
        <input
          type="text"
          class="retro-input"
          id="url-input"
          placeholder="Paste stream url..."
          autocomplete="off"
        />
        <button
          class="btn-power"
          id="fetch-btn"
          onclick="doFetch()"
          title="Turn on"
        >
          <!-- Power Icon -->
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18.36 6.64a9 9 0 1 1-12.73 0"></path>
            <line x1="12" y1="2" x2="12" y2="12"></line>
          </svg>
        </button>
      </div>

      <div class="static-footer">
        <span>SYSTEM READY</span>
        <span class="blink">●</span>
      </div>
    </div>

  </div>

  <!-- PREVIEW (RETRO MENU) -->
  <div class="preview-card" id="preview-card">
    
    <div class="hero-wrapper" id="hero-bg">
      <div class="hero-overlay">
        <div class="hero-content">
          
          <div class="data-banner">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><path d="M22 4L12 14.01l-3-3"/></svg>
            SIGNAL FOUND
          </div>

          <div class="p-type" id="p-type">TV Series</div>
          <h2 class="p-title" id="p-title">Go For It, Nakamura!</h2>
          <div class="p-studio" id="p-studio" style="display:none">Studio Name</div>

          <div class="meta-inline" id="meta-inline"></div>
          <div class="genre-pills" id="genre-pills"></div>

        </div>
      </div>
    </div>

    <div class="details-container">
      <div class="sidebar-cover" id="sidebar-cover">
        <div style="width:100%; height:100%; background:#222; display:flex; align-items:center; justify-content:center; color:#444;">▢</div>
      </div>

      <div class="main-info">
        <div>
          <label class="form-label">Synopsis</label>
          <div class="synopsis-block" id="synopsis-block"></div>
          <button class="read-more-btn" id="read-more-btn" onclick="toggleSynopsis()">Read More</button>
        </div>

        <div class="form-section">
          <div class="form-header">
            <label class="form-label" style="margin:0; font-size:24px; color:var(--accent);">SETUP</label>
          </div>
          
          <div class="form-row-3">
            <div>
              <label class="form-label">Status</label>
              <div class="select-wrap">
                <select id="f-status">                
                  <option>○ Plan to Watch</option>
                  <option>▶ Watching</option>
                  <option>✓ Completed</option>
                  <option>⏸ On Hold</option>
                  <option>✕ Dropped</option>
                </select>
              </div>
            </div>
            <div>
              <label class="form-label">Score (1–10)</label>
              <input type="number" id="f-score" min="1" max="10" placeholder="—" />
            </div>
            <div>
              <label class="form-label">Progress</label>
              <input type="text" id="f-ep" placeholder="e.g. S1E9" />
            </div>
          </div>

          <!-- Notes Grid -->
          <div class="notes-grid">
            <div>
              <label class="form-label">Review</label>
              <textarea id="f-thoughts" placeholder="Review, notes, spoilers..." style="height: 100px;"></textarea>
            </div>
            <div>
              <label class="form-label">Private Notes</label>
              <textarea id="f-notes" placeholder="Quotes, reminders, references..." style="height: 100px;"></textarea>
            </div>
          </div>

          <div class="form-actions">
            <!-- B Button (Back) -->
            <div style="display:flex; align-items:center; gap:12px;">
               <div class="actions-label">B: CANCEL</div>
               <button class="btn-retro-action btn-b" onclick="resetPreview()">
                  <!-- Back Icon -->
                  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/>
                  </svg>
               </button>
            </div>

            <!-- A Button (Add) -->
            <div style="display:flex; align-items:center; gap:12px;">
               <button class="btn-retro-action btn-a" id="push-btn" onclick="pushToNotion()">
                <svg
                  width="24"
                  height="24"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2.0"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path d="M4 4h13l3 3v13H4z"/>
                  <path d="M8 4v6h8V4"/>
                  <path d="M8 18h8"/>
                </svg>
              </button>
               <div class="actions-label">A: CONFIRM</div>
            </div>
          </div>
        </div>

      </div>
    </div>
  </div>

</main>

<script>
const DEFAULTS = {
  fn: 'https://kjspeqcrfhzxnodjkznu.supabase.co/functions/v1/fetch-watch-meta',
  token: 'ntn_t43658643618u5gu5r5G6iGLFSRDmqhzf4yLOnCdBZw8Tr',
  db: '93313b1949174113861649337904fc7d',
};

let current = null;

function cfg(key) {
  return localStorage.getItem('mv_' + key) || DEFAULTS[key] || '';
}
function loadConfig() {
  document.getElementById('cfg-fn').value = cfg('fn');
  document.getElementById('cfg-token').value = cfg('token');
  document.getElementById('cfg-db').value = cfg('db');
}
function saveConfig() {
  localStorage.setItem('mv_fn', document.getElementById('cfg-fn').value.trim());
  localStorage.setItem('mv_token', document.getElementById('cfg-token').value.trim());
  localStorage.setItem('mv_db', document.getElementById('cfg-db').value.trim());
  showMsg('Configuration saved successfully.', 'i');
}
function toggleConfig() {
  const p = document.getElementById('config-panel');
  const open = p.classList.toggle('open');
  document.getElementById('config-label').textContent = open ? 'Hide' : 'Config';
}
function showMsg(txt, type) {
  const el = document.getElementById('msg');
  el.textContent = txt;
  el.className = 'msg show msg-' + type;
  if (type !== 'e') setTimeout(() => el.classList.remove('show'), 4000);
}

// Helper for chips
function fillInput(text) {
  const input = document.getElementById('url-input');
  input.value = "https://" + text + "/...";
  input.focus();
}

// Toggle Synopsis Logic (Read More / Read Less)
function toggleSynopsis() {
  const el = document.getElementById('synopsis-block');
  const btn = document.getElementById('read-more-btn');
  
  if (el.classList.contains('synopsis-expanded')) {
    el.classList.remove('synopsis-expanded');
    btn.textContent = "Read More";
  } else {
    el.classList.add('synopsis-expanded');
    btn.textContent = "Read Less";
  }
}

function showInitial() {
  document.getElementById('initial-state').style.display = 'flex';
  document.getElementById('preview-card').classList.remove('show');
  current = null;
}

function showPreview() {
  document.getElementById('initial-state').style.display = 'none';
  document.getElementById('preview-card').classList.add('show');
}

function resetPreview() {
  showInitial();
  document.getElementById('url-input').value = '';
  document.getElementById('f-score').value = '';
  document.getElementById('f-ep').value = '';
  document.getElementById('f-thoughts').value = '';
  document.getElementById('f-notes').value = '';
}

async function doFetch() {
  const url = document.getElementById('url-input').value.trim();
  if (!url) return;

  const btn = document.getElementById('fetch-btn');
  const originalContent = btn.innerHTML;
  btn.disabled = true;
  btn.innerHTML = '<span class="spin"></span>';

  try {
    const r = await fetch(cfg('fn'), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ url }),
    });
    const d = await r.json();
    if (!r.ok || d.error) throw new Error(d.error || 'Failed to fetch metadata');
    current = { ...d, watchUrl: url };
    renderPreview(d);
    showPreview();
  } catch (e) {
    showMsg('Error: ' + e.message, 'e');
  } finally {
    btn.disabled = false;
    btn.innerHTML = originalContent;
  }
}

function renderPreview(d) {
  const hero = document.getElementById('hero-bg');
  if (d.cover) {
    hero.style.backgroundImage = `url('${d.cover}')`;
  } else {
    hero.style.backgroundImage = 'none';
    hero.style.backgroundColor = '#222';
  }

  const sidebar = document.getElementById('sidebar-cover');
  if (d.cover) {
    sidebar.innerHTML = `<img src="${d.cover}" alt="" onerror="this.parentElement.innerHTML='<div style=\'width:100%;height:100%;background:#222;display:flex;align-items:center;justify-content:center;color:#444;\'>▢</div>'" />`;
  } else {
    sidebar.innerHTML = `<div style="width:100%;height:100%;background:#222;display:flex;align-items:center;justify-content:center;color:#444;">▢</div>`;
  }

  document.getElementById('p-type').textContent = [d.type, d.year].filter(Boolean).join(' · ');
  document.getElementById('p-title').textContent = d.title || 'Untitled';

  const studioEl = document.getElementById('p-studio');
  if (d.studios) { studioEl.textContent = d.studios; studioEl.style.display = 'block'; }
  else studioEl.style.display = 'none';

  const chips = [];
  if (d.episodes != null) {
    chips.push(`<div class="meta-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg> <span class="meta-text">${d.episodes} Eps</span></div>`);
  }
  if (d.duration) {
    chips.push(`<div class="meta-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg> <span class="meta-text">${d.duration}m</span></div>`);
  }
  if (d.status) {
    chips.push(`<div class="meta-item"><span style="color:var(--muted); margin-right:4px;">Status:</span> <span class="meta-status">${d.status}</span></div>`);
  }
  document.getElementById('meta-inline').innerHTML = chips.join('');

  document.getElementById('genre-pills').innerHTML =
    (d.genres || []).map(g => `<div class="genre-pill"><span>•</span> ${g}</div>`).join('');

  const synEl = document.getElementById('synopsis-block');
  const readMoreBtn = document.getElementById('read-more-btn');
  
  // 1. Reset state
  synEl.classList.remove('synopsis-expanded');
  synEl.style.display = 'block'; 
  readMoreBtn.style.display = 'none';

  if (d.synopsis) {
    synEl.textContent = d.synopsis;

    // 2. Delay checking slightly to ensure rendering is complete
    setTimeout(() => {
      if (synEl.scrollHeight > synEl.clientHeight) {
        readMoreBtn.style.display = 'inline-block';
        readMoreBtn.textContent = 'Read More';
      } else {
        readMoreBtn.style.display = 'none';
      }
    }, 150);
  } else {
    synEl.textContent = 'No synopsis available.';
  }
}

async function pushToNotion() {
  if (!current) return;
  const btn = document.getElementById('push-btn');
  const originalText = btn.innerHTML;
  btn.disabled = true;
  btn.innerHTML = '<span class="spin"></span>';

  const notionToken = cfg('token');
  const notionDb = cfg('db');
  if (!notionToken || !notionDb) {
    showMsg('Please configure Notion Token and Database ID in Config.', 'e');
    btn.disabled = false;
    btn.innerHTML = originalText;
    return;
  }

  const d = current;
  try {
    const r = await fetch(cfg('fn'), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        url: d.watchUrl,
        notionToken,
        notionDbId: notionDb,
        overrides: {
          status: document.getElementById('f-status').value,
          score: document.getElementById('f-score').value ? parseFloat(document.getElementById('f-score').value) : null,
          ep: document.getElementById('f-ep').value,
          thoughts: document.getElementById('f-thoughts').value,
        },
        prefetched: d,
      }),
    });
    const nd = await r.json();
    if (!r.ok || nd.error) throw new Error(nd.error || nd.message || 'Failed to add to Notion');
    showMsg('Successfully added "' + d.title + '" to Notion!', 's');
    resetPreview();
  } catch (e) {
    showMsg('Error: ' + e.message, 'e');
  } finally {
    btn.disabled = false;
    btn.innerHTML = originalText;
  }
}

document.getElementById('url-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') doFetch();
});

loadConfig();
</script>
</body>
</html>
